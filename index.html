<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>مِرقاة — محاسبة النفس</title>
<meta name="theme-color" content="#F3EDE1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مِرقاة">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   مِرقاة — محاسبة النفس اليومية
   ملف واحد مستقل · بلا مكتبات خارجية · يعمل بلا إنترنت
   الأسبوع: من السبت إلى الجمعة
   ============================================================ */

:root{
  --bg:#F3EDE1; --bg2:#E7DDC9; --card:#FFFCF5; --card2:#F7F1E4;
  --line:rgba(42,35,24,.13); --line2:rgba(42,35,24,.07);
  --ink:#2A2318; --ink2:#7A6E5B; --ink3:#A2957F;
  --accent:#0E6B5B; --accent2:#0A5348; --gold:#A9761B;
  --shadow:0 2px 0 rgba(42,35,24,.06), 0 10px 26px rgba(42,35,24,.07);
  --sheet:#FFFCF5;
  --s6:#4F46C9; --s4:#158466; --s2:#C08A12; --s1:#D2691E; --s0:#B93A36;
  --grid:rgba(42,35,24,.10);
}
html[data-theme="dark"]{
  --bg:#0E1614; --bg2:#152321; --card:rgba(255,255,255,.055); --card2:rgba(255,255,255,.03);
  --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.07);
  --ink:#F1ECE1; --ink2:#9FAFA8; --ink3:#78877F;
  --accent:#37C6A2; --accent2:#22997C; --gold:#E0B152;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --sheet:#16211F;
  --s6:#7B72F0; --s4:#1FA37E; --s2:#D9A21B; --s1:#E5813C; --s0:#D3524E;
  --grid:rgba(255,255,255,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  background-image:radial-gradient(120% 70% at 50% 0%, var(--bg2) 0%, var(--bg) 62%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;
  -webkit-tap-highlight-color:transparent;
  min-height:100vh;
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;padding:0}
input,textarea,select{font-family:inherit}
.kufi{font-family:'Reem Kufi',serif}

#app{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px 104px}

/* ---------- الترويسة ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:9px}
.mark{width:38px;height:38px;border-radius:12px;background:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);flex:0 0 auto}
.mark svg{display:block}
.brand h1{font-family:'Reem Kufi',serif;font-size:25px;margin:0;line-height:1;letter-spacing:.5px}
.brand p{margin:3px 0 0;font-size:11px;font-weight:600;color:var(--ink2)}
.wk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:7px 12px;text-align:center;box-shadow:var(--shadow);min-width:104px}
.wk b{display:block;font-family:'Reem Kufi',serif;font-size:21px;line-height:1.1;color:var(--accent)}
.wk span{font-size:10px;font-weight:600;color:var(--ink2)}
.wk.full b{color:var(--s6)}

/* ---------- عناصر عامة ---------- */
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 3px 9px}
.sect h2{font-family:'Reem Kufi',serif;font-size:17px;margin:0;font-weight:500}
.sect em{font-style:normal;font-size:11px;font-weight:600;color:var(--ink2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.empty{color:var(--ink2);font-size:12.5px;font-weight:600;text-align:center;padding:16px}
.hint{font-size:11px;font-weight:600;color:var(--ink2);line-height:1.8}
.foot{text-align:center;color:var(--ink3);font-size:11px;font-weight:600;margin:26px 0 4px}
.screen{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* ---------- شريط التاريخ ---------- */
.datebar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:5px;box-shadow:var(--shadow)}
.nav-a{width:38px;height:38px;border-radius:11px;font-size:22px;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.nav-a:disabled{opacity:.22}
.dcenter{text-align:center;flex:1;min-width:0}
.dcenter b{display:block;font-family:'Reem Kufi',serif;font-size:17px;font-weight:500}
.dcenter i{font-style:normal;font-size:11px;font-weight:600;color:var(--ink2)}
.dcenter u{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);cursor:pointer;margin-top:1px}

/* ---------- الأثر ---------- */
.quote{position:relative;margin-top:11px;padding:15px 17px 13px;border-right:3px solid var(--gold);cursor:pointer;overflow:hidden;background:var(--card2)}
.quote p{margin:0;font-size:15.5px;font-weight:500;line-height:2.15}
.quote span{display:block;margin-top:7px;font-size:11.5px;font-weight:700;color:var(--gold)}
.quote i{position:absolute;left:13px;bottom:11px;font-style:normal;font-size:10px;font-weight:600;color:var(--ink3)}

/* ---------- لوحة الميزان ---------- */
.gauge{display:flex;gap:14px;align-items:center;padding:14px;margin-top:11px}
.gwrap{position:relative;width:132px;height:78px;flex:0 0 auto}
.gwrap svg{display:block}
.gnum{position:absolute;inset:auto 0 0;text-align:center}
.gnum b{display:block;font-family:'Reem Kufi',serif;font-size:31px;line-height:1}
.gnum span{font-size:10.5px;font-weight:700;color:var(--ink2)}
.gside{flex:1;min-width:0}
.grow{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;color:var(--ink2);margin-bottom:4px}
.bar{height:8px;border-radius:99px;background:var(--line2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line2)}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .45s ease}
.chips7{display:flex;gap:4px;margin-top:11px}
.d7{flex:1;height:30px;border-radius:9px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--ink2);line-height:1.15;background:var(--card2)}
.d7 i{font-style:normal;font-size:8.5px;opacity:.75}
.d7.on{box-shadow:0 0 0 2px var(--accent)}
.d7.has{color:#fff;border-color:transparent}
.delta{font-size:11px;font-weight:700;margin-top:9px;color:var(--ink2)}
.delta b{font-family:'Reem Kufi',serif;font-size:13px}

/* ---------- الصلوات ---------- */
.plist{display:flex;flex-direction:column;gap:7px}
.prow{display:flex;align-items:center;gap:10px;width:100%;text-align:right;padding:11px 13px;background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);transition:transform .08s ease}
.prow:active{transform:scale(.988)}
.prow.bonus{border-color:color-mix(in srgb, var(--s6) 55%, transparent)}
.pname{font-family:'Reem Kufi',serif;font-size:17px;flex:0 0 56px;font-weight:500}
.pdots{display:flex;gap:5px;flex:1}
.dot{width:25px;height:25px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.dot.off{background:transparent;border:1px dashed var(--line);color:var(--ink3)}
.dot.plus{width:auto;padding:0 7px;background:var(--s6);font-family:'Reem Kufi',serif}
.pscore{font-family:'Reem Kufi',serif;font-size:19px;min-width:52px;text-align:left}
.pscore i{font-style:normal;font-size:10.5px;font-family:'IBM Plex Sans Arabic';font-weight:600;color:var(--ink3);margin-right:2px}
.pscore .add{font-family:'IBM Plex Sans Arabic';font-size:12px;font-weight:700;color:var(--accent)}

/* ---------- الأوراد والعادات ---------- */
.wird{padding:12px;display:flex;flex-direction:column;gap:9px}
.wlab{font-size:13.5px;font-weight:700}
.wlab i{display:block;font-style:normal;font-size:10.5px;font-weight:600;color:var(--ink2);margin-top:2px}
.seg{display:flex;gap:5px}
.seg button{flex:1;padding:9px 6px;border-radius:11px;border:1px solid var(--line);background:var(--card2);font-size:12.5px;font-weight:700;color:var(--ink2)}
.seg button.on{color:#fff;border-color:transparent}
.wline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:9px;border-top:1px solid var(--line2)}
.tog{width:52px;height:30px;border-radius:99px;background:var(--line2);position:relative;border:1px solid var(--line);flex:0 0 auto;transition:background .18s}
.tog i{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s ease}
.tog.on{background:var(--s4);border-color:transparent}
.tog.on i{transform:translateX(-22px);background:#fff}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 13px;background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}
.hrow.ok{border-color:color-mix(in srgb, var(--s4) 55%, transparent)}
.hname{font-size:14px;font-weight:700;min-width:0}
.hname i{display:block;font-style:normal;font-size:10.5px;font-weight:600;color:var(--ink2);margin-top:2px}
.chk{width:32px;height:32px;border-radius:10px;border:2px solid var(--line);font-size:16px;color:var(--ink3);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.chk.on{background:var(--s4);border-color:var(--s4);color:#fff}
.cnt{display:flex;align-items:center;gap:3px;flex:0 0 auto}
.cnt button{width:30px;height:30px;border-radius:9px;background:var(--card2);border:1px solid var(--line);font-size:17px;font-weight:700}
.cnt span{font-family:'Reem Kufi',serif;font-size:16px;min-width:56px;text-align:center}
.cnt span i{font-style:normal;font-size:10px;font-family:'IBM Plex Sans Arabic';font-weight:600;color:var(--ink3)}
textarea.note{width:100%;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px;font-size:14px;font-weight:500;line-height:1.9;color:var(--ink);resize:vertical;box-shadow:var(--shadow)}
textarea.note:focus,input.in:focus{outline:none;border-color:var(--accent)}

/* ---------- الشريط السفلي ---------- */
.tabs{position:fixed;inset:auto 0 0;display:flex;justify-content:center;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:20}
.tabs button{flex:1;max-width:150px;padding:9px 4px;border-radius:13px;font-family:'Reem Kufi',serif;font-size:15px;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button.on{background:var(--accent);color:#fff}

/* ---------- بطاقة التسجيل ---------- */
.veil{position:fixed;inset:0;z-index:40;background:rgba(20,14,6,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;padding:10px}
.sheet{width:100%;max-width:560px;max-height:94vh;display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.4);animation:up .26s ease}
@keyframes up{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;background:var(--accent);color:#fff}
.shead b{font-family:'Reem Kufi',serif;font-size:22px;font-weight:500}
.shead em{font-style:normal;font-size:11.5px;font-weight:600;opacity:.85}
.shead button{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.16);font-size:17px}
.sbody{padding:14px 15px;overflow:auto}
.grp{margin-bottom:15px}
.gtit{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:7px}
.gtit b{font-family:'Reem Kufi',serif;font-size:16px;font-weight:500}
.gtit em{font-style:normal;font-size:10.5px;font-weight:700;color:var(--ink3)}
.opts{display:flex;flex-direction:column;gap:5px}
.opt{display:flex;align-items:center;gap:9px;width:100%;text-align:right;padding:10px 11px;border:1.5px solid var(--line);border-radius:12px;background:var(--card2);font-size:14px;font-weight:600}
.opt .sw{width:11px;height:11px;border-radius:4px;flex:0 0 auto}
.opt b{margin-right:auto;font-family:'Reem Kufi',serif;font-size:16px;font-weight:500;color:var(--ink3)}
.opt.on{color:#fff;border-color:transparent}
.opt.on .sw{background:rgba(255,255,255,.85)!important}
.opt.on b{color:rgba(255,255,255,.9)}
.noratiba{font-size:12.5px;font-weight:600;color:var(--ink3);padding:8px 2px}
.sfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 15px;border-top:1px solid var(--line);background:var(--card2)}
.stot{font-family:'Reem Kufi',serif;font-size:23px;line-height:1.2}
.stot i{font-style:normal;font-size:11px;font-family:'IBM Plex Sans Arabic';font-weight:600;color:var(--ink3)}
.stot em{display:block;font-style:normal;font-size:10.5px;font-family:'IBM Plex Sans Arabic';font-weight:700;color:var(--s6)}
.btns{display:flex;gap:7px}
.btn{padding:11px 17px;border-radius:13px;background:var(--accent);color:#fff;font-family:'Reem Kufi',serif;font-size:16px;font-weight:500;transition:transform .07s}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.38}
.btn.sm{padding:9px 13px;font-size:14px}
.btn.gh{background:transparent;color:var(--ink2);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.dg{background:transparent;color:var(--s0);box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--s0) 45%, transparent)}

/* ---------- السجل ---------- */
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:700;color:var(--ink2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.sm{padding:5px 11px;font-size:11.5px}
.stats{display:flex;gap:6px;margin-top:11px}
.st{flex:1;padding:10px 5px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.st b{display:block;font-family:'Reem Kufi',serif;font-size:21px;line-height:1.15;color:var(--accent)}
.st span{display:block;font-size:10.5px;font-weight:700;margin-top:2px}
.st i{display:block;font-style:normal;font-size:9.5px;font-weight:600;color:var(--ink3)}
.chart{padding:10px 6px 4px}
.chead{display:flex;justify-content:space-between;align-items:baseline;padding:0 8px 6px;font-size:11px;font-weight:700;color:var(--ink2)}
.chead b{font-family:'Reem Kufi',serif;font-size:16px;margin:0 3px}
.cal{padding:12px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.calhead b{font-family:'Reem Kufi',serif;font-size:16px;font-weight:500}
.calhead button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);font-size:16px;color:var(--ink2)}
.calhead button:disabled{opacity:.25}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.gh{text-align:center;font-size:10px;font-weight:700;color:var(--ink3);padding-bottom:2px}
.cell{aspect-ratio:1;border-radius:9px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:var(--ink3);background:var(--card2)}
.cell.has{color:#fff;border-color:transparent}
.cell.now{box-shadow:0 0 0 2px var(--gold)}
.cell.blank{border:none;background:none}
.legend{display:flex;flex-wrap:wrap;gap:9px;margin-top:11px;justify-content:center}
.lg{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:var(--ink2)}
.lg i{width:12px;height:12px;border-radius:4px}
.rank{padding:12px;display:flex;flex-direction:column;gap:9px}
.rrow{display:flex;align-items:center;gap:9px}
.rrow span{flex:0 0 52px;font-family:'Reem Kufi',serif;font-size:14px;font-weight:500}
.rbar{flex:1;height:11px;border-radius:99px;background:var(--line2);overflow:hidden}
.rbar>i{display:block;height:100%;border-radius:99px;transition:width .4s}
.rrow b{flex:0 0 40px;text-align:left;font-family:'Reem Kufi',serif;font-size:14px;font-weight:500;color:var(--ink2)}
.wkrow{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line2)}
.wkrow:last-child{border-bottom:none}
.wkrow span{flex:0 0 104px;font-size:11px;font-weight:700;color:var(--ink2)}
.wkrow b{flex:0 0 44px;text-align:left;font-family:'Reem Kufi',serif;font-size:15px;font-weight:500}
.ngroup{padding:11px 13px;margin-bottom:8px}
.ndate{font-family:'Reem Kufi',serif;font-size:14px;color:var(--accent);margin-bottom:5px;font-weight:500}
.nitem{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line2)}
.nitem:first-of-type{border-top:none}
.nwho{flex:0 0 auto;font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--line2);color:var(--ink2);margin-top:2px}
.nitem p{margin:0;font-size:13px;font-weight:500;line-height:1.95}

/* ---------- الضبط ---------- */
.ref{padding:13px}
.rline{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:600;padding:7px 0;border-bottom:1px solid var(--line2)}
.rline:last-child{border-bottom:none}
.rline b{font-family:'Reem Kufi',serif;font-size:15px;font-weight:500;color:var(--accent);white-space:nowrap}
.rline.sum{color:var(--gold)}
.rline.sum b{color:var(--gold)}
.box{padding:12px;display:flex;flex-direction:column;gap:9px;margin-top:9px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.in{background:var(--card2);border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;font-size:14px;font-weight:600;color:var(--ink);width:100%}
.in.num{width:76px;text-align:center}
.in.mid{width:110px}
.del{padding:6px 11px;border-radius:9px;font-size:11.5px;font-weight:700;color:var(--s0);background:color-mix(in srgb, var(--s0) 12%, transparent)}
.del.on{background:var(--s0);color:#fff}
.swap{display:flex;gap:5px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:4px}
.swap button{flex:1;padding:8px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink2)}
.swap button.on{background:var(--accent);color:#fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="pick" accept="application/json" style="display:none">

<script>
"use strict";
/* ============================================================
   [١] النظام والثوابت
   ------------------------------------------------------------
   الصلاة   = حضور ٤ + خشوع ٤ + أذكار ٣ = ١١   (بونص حتى +٢)
   الأوراد  = قرآن ٣ + صباح ١ + مساء ١ = ٥
   اليوم    = (١١ × ٥) + ٥ = ٦٠
   الأسبوع  = ٦٠ × ٧ = ٤٢٠   (من السبت إلى الجمعة)
   ============================================================ */

var BASE_PRAYER = 11, BASE_WIRD = 5, BASE_DAY = 60, BASE_WEEK = 420;
var STREAK_RATIO = 0.7;
var KEY = "mirqat:v1";

var PRAYERS = [
  { id:"fajr",    name:"الفجر",  ratiba:true,  rlabel:"سنة الفجر" },
  { id:"dhuhr",   name:"الظهر",  ratiba:true,  rlabel:"راتبة الظهر" },
  { id:"asr",     name:"العصر",  ratiba:false, rlabel:"" },
  { id:"maghrib", name:"المغرب", ratiba:true,  rlabel:"راتبة المغرب" },
  { id:"isha",    name:"العشاء", ratiba:true,  rlabel:"راتبة العشاء" }
];

var AXES = {

var AR = "٠١٢٣٤٥٦٧٨٩";
function ar(n){ return String(n).split("").map(function(c){ return /[0-9]/.test(c) ? AR[+c] : c; }).join(""); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

var MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
var DAYS   = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
var DLET   = ["ح","ن","ث","ر","خ","ج","س"];

function key(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parse(s){ var p=s.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
function shift(s,n){ var d=parse(s); d.setDate(d.getDate()+n); return key(d); }
function today(){ return key(new Date()); }
function longDate(s){ var d=parse(s); return DAYS[d.getDay()]+" "+ar(d.getDate())+" "+MONTHS[d.getMonth()]+" "+ar(d.getFullYear()); }
function shortDate(s){ var d=parse(s); return ar(d.getDate())+"/"+ar(d.getMonth()+1); }
function weekStart(s){ var d=parse(s); d.setDate(d.getDate()-((d.getDay()+1)%7)); return key(d); }
function monthName(mk){ var p=mk.split("-"); return MONTHS[+p[1]-1]+" "+ar(p[0]); }
function arDays(n){
  if(n===0) return "لم تبدأ";
  if(n===1) return "يوم واحد";
  if(n===2) return "يومان";
  if(n<=10) return ar(n)+" أيام";
  return ar(n)+" يوماً";
}

function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function scaleColor(v){
  if(v>=6) return "var(--s6)";
  if(v>=4) return "var(--s4)";
  if(v>=2) return "var(--s2)";
  if(v>=1) return "var(--s1)";
  return "var(--s0)";
}
function threeColor(v){ return v>=3 ? "var(--s4)" : v>=1 ? "var(--s2)" : "var(--s0)"; }
function ratioColor(val, base){
  if(val==null) return "var(--line2)";
  var r = base ? val/base : 0;
  if(r>1.0001) return "var(--s6)";
  if(r>=0.9)  return "var(--s4)";
  if(r>=0.65) return "var(--s2)";
  if(r>=0.35) return "var(--s1)";
  return "var(--s0)";
}

   [٤] الحساب
   ============================================================ */
function pDone(p){ return !!(p && p.a!=null && p.k!=null && p.z!=null); }
function pBonus(p){ return p ? (p.r?1:0)+(p.t?1:0) : 0; }
function pScore(p){ return pDone(p) ? p.a+p.k+p.z+pBonus(p) : 0; }
function wirdScore(d){
  if(!d || !d.w) return 0;
  return (d.w.q||0) + (d.w.sb?1:0) + (d.w.ms?1:0);
}
function dayScore(d){
  if(!d) return 0;
  var s = wirdScore(d);
  for(var i=0;i<PRAYERS.length;i++) s += pScore(d.p && d.p[PRAYERS[i].id]);
  return s;
}
function dayHasData(d){
  if(!d) return false;
  if(d.note && d.note.trim()) return true;
  if(wirdScore(d)>0 || (d.w && d.w.q!=null)) return true;
  for(var i=0;i<PRAYERS.length;i++) if(pDone(d.p && d.p[PRAYERS[i].id])) return true;
  for(var k in (d.h||{})) if(d.h[k]) return true;
  return false;
}
function prayersDone(d){
  var n=0; if(!d) return 0;
  for(var i=0;i<PRAYERS.length;i++) if(pDone(d.p && d.p[PRAYERS[i].id])) n++;
  return n;
}
function habitScore(d){
  var got=0, max=0, done=0;
  S.cfg.habits.forEach(function(h){
    max += +h.points || 0;
    var v = (d && d.h && d.h[h.id]) || 0;
    var ok = h.type==="check" ? v>=1 : v>=h.target;
    if(ok){ got += +h.points||0; done++; }
  });
  return { got:got, max:max, done:done };
}
function qualifies(ds){
  var d = getDay(ds);
  return !!d && prayersDone(d)===5 && dayScore(d) >= BASE_DAY*STREAK_RATIO;
}
function currentStreak(){
  var d = today(), n = 0;
  if(!qualifies(d)) d = shift(d,-1);
  while(qualifies(d) && d >= S.cfg.start){ n++; d = shift(d,-1); }
  return n;
}
function longestStreak(){
  var keys = Object.keys(S.days).sort();
  var best=0, run=0, prev=null;
  keys.forEach(function(ds){
    if(!qualifies(ds)){ run=0; prev=ds; return; }
    run = (prev && shift(prev,1)===ds && run>0) ? run+1 : 1;
    if(run>best) best=run;
    prev = ds;
  });
  return best;
}

function metricOf(id){ for(var i=0;i<METRICS.length;i++) if(METRICS[i].id===id) return METRICS[i]; return METRICS[0]; }
function pMetric(p, m){
  if(!pDone(p)) return null;
  if(m==="total") return pScore(p);
  if(m==="bonus") return pBonus(p);
  if(m==="a"||m==="k"||m==="z") return p[m];
  return null;
}
function dMetric(d, m){
  if(!d) return null;
  if(m==="wird")  return dayHasData(d) ? wirdScore(d) : null;
  if(m==="total") return dayHasData(d) ? dayScore(d)  : null;
  var s=0, any=false;
  PRAYERS.forEach(function(pr){
    var v = pMetric(d.p && d.p[pr.id], m);
    if(v!=null){ s+=v; any=true; }
  });
  return any ? s : null;
}

  var out=[], d=today(), start=S.cfg.start;
  for(var i=0;i<n;i++){ if(d<start) break; out.push(d); d=shift(d,-1); }

}

   ============================================================ */
function gaugeSVG(pct, color){
  var cx=66, cy=68, r=54, sw=13;
  function pt(a){ var rad=a*Math.PI/180; return [cx+r*Math.cos(rad), cy+r*Math.sin(rad)]; }
  var bg0=pt(180), bg1=pt(360);
  var out = '<svg width="132" height="78" viewBox="0 0 132 78">';
  out += '<path d="M '+bg0[0]+' '+bg0[1]+' A '+r+' '+r+' 0 0 1 '+bg1[0]+' '+bg1[1]+'" fill="none" stroke="var(--line2)" stroke-width="'+sw+'" stroke-linecap="round"/>';
  if(pct>0.002){
    var end = pt(360 - 180*Math.min(1,pct));
    var st  = pt(360);
    out += '<path d="M '+st[0]+' '+st[1]+' A '+r+' '+r+' 0 0 0 '+end[0]+' '+end[1]+'" fill="none" stroke="'+color+'" stroke-width="'+sw+'" stroke-linecap="round"/>';
  }
  out += '</svg>';
  return out;
}

function barsSVG(series, base){
  var W=340, H=168, padT=14, padB=24, padL=6, padR=28;
  var n = series.length;
  if(!n) return '<div class="empty">لا توجد بيانات في هذه المدة.</div>';
  var maxV = base;
  series.forEach(function(s){ if(s.value>maxV) maxV=s.value; });
  var top = Math.max(1, Math.ceil(maxV*1.14));
  var plotW = W-padL-padR, plotH = H-padT-padB;
  var bw = plotW/n;
  var Y = function(v){ return padT + (1 - v/top)*plotH; };
  var out = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet">';
  [0,0.5,1].forEach(function(f){
    var v = Math.round(top*f);
    out += '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--grid)" stroke-width="1"/>';
    out += '<text x="'+(W-padR+5)+'" y="'+(Y(v)+4)+'" fill="var(--ink3)" font-size="10" font-weight="700" text-anchor="start">'+ar(v)+'</text>';
  });
  if(base>0){
    out += '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+Y(base)+'" y2="'+Y(base)+'" stroke="var(--gold)" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.9"/>';
  }
  series.forEach(function(s,i){
    var x = W-padR-(i+1)*bw + Math.min(3, bw*0.16);
    var w = Math.max(2, bw - Math.min(6, bw*0.32));
    var h = Math.max(s.has ? 3 : 2, (H-padB) - Y(s.value));
    var y = (H-padB) - h;
    var col = s.has ? ratioColor(s.value, base||1) : "var(--line2)";
    var rd = Math.min(4, w/2);
    out += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="'+rd+'" fill="'+col+'"/>';
  });
  var step = n<=8 ? 1 : Math.ceil(n/6);
  series.forEach(function(s,i){
    if(i%step) return;
    var x = W-padR-(i+0.5)*bw;
    out += '<text x="'+x.toFixed(1)+'" y="'+(H-8)+'" fill="var(--ink3)" font-size="9.5" font-weight="700" text-anchor="middle">'+s.label+'</text>';
  });
  out += '</svg>';
  return out;
}

    var p = d && d.p ? d.p[pr.id] : null;
    var done = pDone(p), sc = pScore(p), bon = done && sc>BASE_PRAYER;
    h += '<button class="prow'+(bon?" bonus":"")+'" data-a="open" data-v="'+pr.id+'">'
       +   '<span class="pname">'+pr.name+'</span>'
       +   '<span class="pdots">'
       +     dotHTML("ح", done?p.a:null, "scale")
       +     dotHTML("خ", done?p.k:null, "scale")
       +     dotHTML("ذ", done?p.z:null, "three")
       +     (done && pBonus(p)>0 ? '<span class="dot plus">+'+ar(pBonus(p))+'</span>' : "")
       +   '</span>'
       +   '<span class="pscore" style="color:'+(done?ratioColor(sc,BASE_PRAYER):"var(--ink3)")+'">'
       +     (done ? ar(sc)+'<i>/ '+ar(BASE_PRAYER)+'</i>' : '<span class="add">سجّل +</span>')
       +   '</span>'
       + '</button>';
  });
  h += '</div>';

  /* الأوراد */
  var w = (d && d.w) || {q:null,sb:0,ms:0};
  h += '<div class="sect"><h2>أوراد اليوم</h2><em>'+ar(wirdScore(d))+' / '+ar(BASE_WIRD)+'</em></div>';
  h += '<div class="card wird">'
     +  '<div class="wlab">ورد القرآن<i>الهدف: '+ar(S.cfg.quran.target)+' '+esc(S.cfg.quran.unit||"")+'</i></div>'
     +  '<div class="seg">';
  WIRD_Q.forEach(function(o){
    var on = w.q===o.v;
    h += '<button class="'+(on?"on":"")+'" data-a="wq" data-v="'+o.v+'"'
       + (on?' style="background:'+threeColor(o.v)+'"':"")+'>'+o.l+' '+ar(o.v)+'</button>';
  });
  h += '</div>'
     + '<div class="wline"><div class="wlab">أذكار الصباح<i>نقطة واحدة</i></div>'
     +   '<button class="tog'+(w.sb?" on":"")+'" data-a="wt" data-i="sb"><i></i></button></div>'
     + '<div class="wline"><div class="wlab">أذكار المساء<i>نقطة واحدة</i></div>'
     +   '<button class="tog'+(w.ms?" on":"")+'" data-a="wt" data-i="ms"><i></i></button></div>'
     + '</div>';

  /* العادات */
  h += '<div class="sect"><h2>العادات</h2><em>'+ar(hab.got)+' / '+ar(hab.max)+' نقطة</em></div>';
  h += '<div class="plist">';
  if(!S.cfg.habits.length) h += '<div class="card empty">لا عادات بعد — أضِفها من الضبط.</div>';
  S.cfg.habits.forEach(function(hb){
    var v = (d && d.h && d.h[hb.id]) || 0;
    var ok = hb.type==="check" ? v>=1 : v>=hb.target;
    h += '<div class="hrow'+(ok?" ok":"")+'">'
       +   '<div class="hname">'+esc(hb.name)+'<i>'+ar(hb.points)+' نقاط'
       +     (hb.type==="count" ? ' · الهدف '+ar(hb.target)+' '+esc(hb.unit||"") : "")+'</i></div>';
    if(hb.type==="check"){
      h += '<button class="chk'+(ok?" on":"")+'" data-a="hchk" data-i="'+hb.id+'">'+(ok?"✓":"")+'</button>';
    }else{
      h += '<div class="cnt">'
         +   '<button data-a="hdec" data-i="'+hb.id+'">−</button>'
         +   '<span style="color:'+(ok?"var(--s4)":"var(--ink)")+'">'+ar(v)+'<i>/'+ar(hb.target)+'</i></span>'
         +   '<button data-a="hinc" data-i="'+hb.id+'">+</button>'
         + '</div>';
    }
    h += '</div>';
  });
  h += '</div>';

  /* المحاسبة */
  h += '<div class="sect"><h2>محاسبة اليوم</h2><em>ماذا تُصلح غداً؟</em></div>';
  h += '<textarea class="note" rows="3" data-inp="note" placeholder="ما الذي أضعف صلاتك اليوم؟ وما الذي تعزم عليه غداً؟">'+esc(d&&d.note?d.note:"")+'</textarea>';
  h += '<div class="foot">يُحفظ كل شيء تلقائياً على هذا الجهاز.</div>';
  h += '</div>';
  return h;
}
function dotHTML(label, v, kind){
  if(v==null) return '<span class="dot off">'+label+'</span>';
  var c = kind==="three" ? threeColor(v) : scaleColor(v);
  return '<span class="dot" style="background:'+c+'">'+label+'</span>';
}

/* ============================================================
   [٨] شاشة السجل
   ============================================================ */
function viewHistory(){
  var M = metricOf(UI.metric);
  var days = rangeDays(UI.range);
  var chrono = days.slice().reverse();

  /* إحصاءات */
  var sum=0, n=0, best=null, bestV=-1, over=0;
  days.forEach(function(ds){
    var d = getDay(ds), v = dMetric(d, UI.metric);
    if(v==null) return;
    sum+=v; n++;
    if(v>bestV){ bestV=v; best=ds; }
    if(UI.metric!=="wird" && d && d.p) PRAYERS.forEach(function(pr){
      var pv = pMetric(d.p[pr.id], UI.metric);
      if(pv!=null && M.pBase && pv>M.pBase) over++;
    });
  });
  var avg = n ? Math.round((sum/n)*10)/10 : 0;

  /* السلسلة */
  var streak = currentStreak(), longest = longestStreak();

  /* المنحنى */
  var series;
  if(UI.mode==="day"){
    series = chrono.map(function(ds){
      var v = dMetric(getDay(ds), UI.metric);
      return { label:shortDate(ds), value:v||0, has:v!=null };
    });
  }else{
    var map = {}, order = [];
    chrono.forEach(function(ds){
      var w = weekStart(ds);
      if(!map[w]){ map[w] = { label:shortDate(w), value:0, has:false }; order.push(w); }
      var v = dMetric(getDay(ds), UI.metric);
      if(v!=null){ map[w].value += v; map[w].has = true; }
    });
    series = order.map(function(w){ return map[w]; });
  }
  var chartBase = UI.mode==="day" ? M.dBase : M.dBase*7;

  /* ترتيب الصلوات */
  var rank = PRAYERS.map(function(pr){
    var s=0, c=0;
    days.forEach(function(ds){
      var d = getDay(ds);
      var v = pMetric(d && d.p ? d.p[pr.id] : null, UI.metric==="wird" ? "total" : UI.metric);
      if(v!=null){ s+=v; c++; }
    });
    return { name:pr.name, avg: c ? s/c : null, c:c };
  });
  var rankBase = (UI.metric==="wird" ? BASE_PRAYER : M.pBase) || 1;
  var rankSorted = rank.slice().sort(function(x,y){
    if(x.avg==null) return 1; if(y.avg==null) return -1; return x.avg - y.avg;
  });

  /* الأسابيع */
  var weeks = [], ws = weekStart(today());
  for(var i=0;i<8;i++){
    if(shift(ws,6) < S.cfg.start) break;
    var t=0, has=false;
    for(var j=0;j<7;j++){ var k=shift(ws,j); t += dayScore(getDay(k)); if(dayHasData(getDay(k))) has=true; }
    weeks.push({ s:ws, e:shift(ws,6), t:t, has:has, i:i });
    ws = shift(ws,-7);
  }

  /* الملاحظات */
  var notes = [];
  days.forEach(function(ds){
    var d = getDay(ds); if(!d) return;
    var items = [];
    if(d.note && d.note.trim()) items.push({ who:"محاسبة", txt:d.note.trim() });
    PRAYERS.forEach(function(pr){
      var p = d.p && d.p[pr.id];
      if(p && p.n && p.n.trim()) items.push({ who:pr.name, txt:p.n.trim() });
    });
    if(items.length) notes.push({ ds:ds, items:items });
  });

  var h = '<div class="screen">';

  h += '<div class="chips">';
  METRICS.forEach(function(m){
    h += '<button class="chip'+(UI.metric===m.id?" on":"")+'" data-a="met" data-v="'+m.id+'">'+m.name+'</button>';
  });
  h += '</div><div class="chips" style="margin-top:6px">';
  [{v:14,l:"أسبوعان"},{v:30,l:"شهر"},{v:90,l:"ثلاثة أشهر"},{v:3650,l:"من البداية"}].forEach(function(r){
    h += '<button class="chip sm'+(UI.range===r.v?" on":"")+'" data-a="rng" data-v="'+r.v+'">'+r.l+'</button>';
  });
  h += '</div>';

  h += '<div class="stats">'
     +  st(n?ar(avg):"—", "المتوسط اليومي", "من "+ar(M.dBase))
     +  st(ar(n), "أيام مسجّلة", "من "+ar(days.length))
     +  st(best?ar(bestV):"—", "أفضل يوم", best?shortDate(best):"")
     +  (UI.metric==="wird" ? st(ar(streak), "السلسلة", "أطولها "+ar(longest))
                            : st(ar(over), "زيادات", "فوق المطلوب"))
     + '</div>';

  h += '<div class="sect"><h2>منحنى '+M.name+'</h2><em>'
     + '<button class="chip sm'+(UI.mode==="day"?" on":"")+'" data-a="mode" data-v="day">يومي</button> '
     + '<button class="chip sm'+(UI.mode==="week"?" on":"")+'" data-a="mode" data-v="week">أسبوعي</button></em></div>';
  h += '<div class="card chart"><div class="chead">'
     +   '<span>الخط الذهبي = المطلوب ('+ar(chartBase)+')</span>'
     +   '<span>الأحدث يساراً</span></div>'
     +   barsSVG(series, chartBase) + '</div>';

  /* الرزنامة */
  h += '<div class="sect"><h2>رزنامة '+M.name+'</h2><em>اضغط يوماً لفتحه</em></div>';
  h += '<div class="card cal">'
     +  '<div class="calhead">'
     +    '<button data-a="mon" data-v="-1">›</button>'
     +    '<b>'+monthName(UI.month)+'</b>'
     +    '<button data-a="mon" data-v="1"'+(UI.month>=today().slice(0,7)?" disabled":"")+'>‹</button>'
     +  '</div><div class="grid7">';
  WEEK_COLS.forEach(function(dw){ h += '<div class="gh">'+DLET[dw]+'</div>'; });
  var yy = +UI.month.split("-")[0], mm = +UI.month.split("-")[1];
  var first = new Date(yy, mm-1, 1), dim = new Date(yy, mm, 0).getDate();
  var off = (first.getDay()+1)%7;
  for(var b=0;b<off;b++) h += '<div class="cell blank"></div>';
  for(var dnum=1;dnum<=dim;dnum++){
    var ds = yy+"-"+String(mm).padStart(2,"0")+"-"+String(dnum).padStart(2,"0");
    var v = ds < S.cfg.start || ds > today() ? null : dMetric(getDay(ds), UI.metric);
    var has = v!=null;
    h += '<button class="cell'+(has?" has":"")+(ds===today()?" now":"")+'" data-a="hday" data-v="'+ds+'"'
       + (has?' style="background:'+ratioColor(v, M.dBase)+'"':'')+'>'+ar(dnum)+'</button>';
  }
  h += '</div><div class="legend">'
     +  lg("var(--s6)","زيادة")+lg("var(--s4)","تام")+lg("var(--s2)","متوسط")
     +  lg("var(--s1)","ضعيف")+lg("var(--s0)","مفرَّط")+lg("var(--line2)","غير مسجّل")
     + '</div></div>';

  /* ترتيب الصلوات */
  h += '<div class="sect"><h2>أين الخلل؟</h2><em>متوسط كل صلاة</em></div>';
  h += '<div class="card rank">';
  rankSorted.forEach(function(r){
    var pctv = r.avg==null ? 0 : Math.min(100, (r.avg/rankBase)*100);
    h += '<div class="rrow"><span>'+r.name+'</span>'
       +   '<div class="rbar"><i style="width:'+pctv.toFixed(1)+'%;background:'+(r.avg==null?"var(--line2)":ratioColor(r.avg,rankBase))+'"></i></div>'
       +   '<b>'+(r.avg==null?"—":ar(Math.round(r.avg*10)/10))+'</b></div>';
  });
  h += '<div class="hint" style="text-align:center">أضعف صلواتك تظهر أولاً — ابدأ الإصلاح منها.</div></div>';

  /* الأسابيع */
  h += '<div class="sect"><h2>الأسابيع</h2><em>السبت ← الجمعة</em></div>';
  h += '<div class="card" style="padding:11px 13px">';
  if(!weeks.length) h += '<div class="empty">لا أسابيع بعد.</div>';
  weeks.forEach(function(w){
    h += '<div class="wkrow"><span>'+(w.i===0?"هذا الأسبوع":shortDate(w.s)+" – "+shortDate(w.e))+'</span>'
       +   '<div class="rbar"><i style="width:'+Math.min(100,(w.t/BASE_WEEK)*100).toFixed(1)+'%;background:'+(w.has?ratioColor(w.t,BASE_WEEK):"var(--line2)")+'"></i></div>'
       +   '<b>'+ar(w.t)+'</b></div>';
  });
  h += '</div>';

  /* الملاحظات */
  var cnt = notes.reduce(function(s,x){ return s+x.items.length; },0);
  h += '<div class="sect"><h2>دفتر المحاسبة</h2><em>'+ar(cnt)+' ملاحظة</em></div>';
  if(!notes.length) h += '<div class="card empty">لم تكتب شيئاً بعد.</div>';
  notes.forEach(function(g){
    h += '<div class="card ngroup"><div class="ndate">'+longDate(g.ds)+'</div>';
    g.items.forEach(function(it){
      h += '<div class="nitem"><span class="nwho">'+esc(it.who)+'</span><p>'+esc(it.txt)+'</p></div>';
    });
    h += '</div>';
  });

  h += '<div class="foot">المتابعة تبدأ من '+longDate(S.cfg.start)+'</div></div>';
  return h;
}
function st(v,l,s){ return '<div class="st"><b>'+v+'</b><span>'+l+'</span><i>'+s+'</i></div>'; }
function lg(c,t){ return '<span class="lg"><i style="background:'+c+'"></i>'+t+'</span>'; }

  h += '<div class="sect"><h2>النسخ الاحتياطي</h2></div>'
     + '<div class="card box"><div class="row">'
     +   '<button class="btn sm" data-a="exp">تصدير نسخة</button>'
     +   '<button class="btn gh sm" data-a="imp">استيراد</button>'
     +   '<button class="btn dg sm" data-a="reset">'+(UI.confirm==="reset"?"تأكيد المسح":"مسح الكل")+'</button>'
     + '</div>'
     + (UI.msg ? '<div class="hint" style="color:var(--accent)">'+esc(UI.msg)+'</div>' : "")
     + '<div class="hint">التخزين: محلي على هذا الجهاز · '+(saveOk?"يعمل":"فيه خلل")+' · '+ar(recorded)+' يوم مسجّل.</div>'
     + '<div class="hint">الاستيراد يستبدل كل ما هو موجود — صدّر نسخة أولاً.</div>'
     + '</div>';

  h += '<div class="foot">مِرقاة — ملف واحد، بلا حساب ولا إنترنت.</div></div>';
  return h;
}
function rl(a,b){ return '<div class="rline"><span>'+a+'</span><b>'+b+'</b></div>'; }

/* ============================================================
   [١٠] الهيكل والرسم
   ============================================================ */
function viewTop(){
  var ws = weekStart(today()), wTotal = 0;
  for(var i=0;i<7;i++) wTotal += dayScore(getDay(shift(ws,i)));
  return '<div class="top">'
    + '<div class="brand">'
    +   '<div class="mark"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round">'
    +     '<path d="M12 3v18"/><path d="M4 8h16"/><path d="M4 8l-2.5 5a3.2 3.2 0 0 0 5 0Z"/><path d="M20 8l2.5 5a3.2 3.2 0 0 1-5 0Z"/><path d="M8.5 21h7"/>'
    +   '</svg></div>'
    +   '<div><h1>مِرقاة</h1><p>محاسبة النفس اليومية</p></div>'
    + '</div>'
    + '<div class="wk'+(wTotal>BASE_WEEK?" full":"")+'"><b>'+ar(wTotal)+'</b><span>من '+ar(BASE_WEEK)+' هذا الأسبوع</span></div>'
    + '</div>';
}
function viewTabs(){
  function b(id,label){ return '<button class="'+(UI.tab===id?"on":"")+'" data-a="tab" data-v="'+id+'">'+label+'</button>'; }
  return '<div class="tabs">'+b("today","اليوم")+b("hist","السجل")+b("set","الضبط")+'</div>';
}
function render(){
  var body = UI.tab==="today" ? viewToday() : UI.tab==="hist" ? viewHistory() : viewSettings();
  document.getElementById("app").innerHTML = viewTop() + body + viewTabs() + viewSheet();
}

/* ============================================================
   [١١] التفاعل
   ============================================================ */
document.addEventListener("click", function(ev){
  var el = ev.target.closest("[data-a]");
  if(!el) return;
  var a = el.dataset.a, v = el.dataset.v, i = el.dataset.i;
  /* النقر داخل البطاقة لا يغلقها — الإغلاق من الخلفية أو من ✕ فقط */
  if(a==="close" && el.classList.contains("veil") && ev.target.closest("[data-stop]")) return;

  switch(a){
    case "tab": UI.tab = v; UI.confirm=null; UI.msg=""; window.scrollTo(0,0); break;
    case "go": UI.cursor = shift(UI.cursor, +v); if(UI.cursor>today()) UI.cursor=today(); break;
    case "today": UI.cursor = today(); break;
    case "pick": UI.cursor = v; break;
    case "athar": UI.athar++; break;

    case "open": {
      var rec = (getDay(UI.cursor)||{}).p ? getDay(UI.cursor).p[v] : null;
      UI.sheet = { ds:UI.cursor, pid:v, exists:!!rec,
        draft: rec ? { a:rec.a, k:rec.k, z:rec.z, r:rec.r||0, t:rec.t||0, n:rec.n||"" }
                   : { a:null, k:null, z:null, r:0, t:0, n:"" } };
      break;
    }
    case "close": UI.sheet = null; break;
    case "set": if(UI.sheet) UI.sheet.draft[i] = (UI.sheet.draft[i]===+v ? null : +v); break;
    case "bon": if(UI.sheet) UI.sheet.draft[i] = UI.sheet.draft[i] ? 0 : 1; break;
    case "save": {
      var sh = UI.sheet; if(!sh) break;
      var d0 = sh.draft;
      if(d0.a==null || d0.k==null || d0.z==null) break;
      var pr = PRAYERS.filter(function(p){ return p.id===sh.pid; })[0];
      editDay(sh.ds, function(day){
        day.p[sh.pid] = { a:d0.a, k:d0.k, z:d0.z, r:(pr.ratiba && d0.r)?1:0, t:d0.t?1:0, n:(d0.n||"").trim() };
      });
      UI.sheet = null;
      break;
    }
    case "del": {
      var s2 = UI.sheet; if(!s2) break;
      editDay(s2.ds, function(day){ delete day.p[s2.pid]; });
      UI.sheet = null;
      break;
    }

    case "wq": editDay(UI.cursor, function(d){ d.w.q = (d.w.q===+v ? null : +v); }); break;
    case "wt": editDay(UI.cursor, function(d){ d.w[i] = d.w[i] ? 0 : 1; }); break;
    case "hchk": editDay(UI.cursor, function(d){ d.h[i] = d.h[i]>=1 ? 0 : 1; }); break;
    case "hinc": editDay(UI.cursor, function(d){ d.h[i] = (d.h[i]||0) + hStep(i); }); break;
    case "hdec": editDay(UI.cursor, function(d){ d.h[i] = Math.max(0,(d.h[i]||0) - hStep(i)); }); break;

    case "met": UI.metric = v; break;
    case "rng": UI.range = +v; break;
    case "mode": UI.mode = v; break;
    case "mon": {
      var p2 = UI.month.split("-").map(Number);
      var dt = new Date(p2[0], p2[1]-1+ +v, 1);
      var mk = dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0");
      if(mk <= today().slice(0,7)) UI.month = mk;
      break;
    }
    case "hday": UI.cursor = v; UI.tab = "today"; window.scrollTo(0,0); break;

    case "theme": S.cfg.theme = v; document.documentElement.setAttribute("data-theme", v); save(); break;
    case "htype": UI.form.type = v; break;
    case "addh": {
      var nm = (UI.form.name||"").trim();
      if(!nm){ UI.msg = "اكتب اسم العادة أولاً."; break; }
      S.cfg.habits.push({
        id:"h"+Date.now(), name:nm, type:UI.form.type,
        target: UI.form.type==="check" ? 1 : Math.max(1, +UI.form.target||1),
        unit: (UI.form.unit||"").trim(),
        points: Math.max(1, +UI.form.points||1)
      });
      UI.form = { name:"", type:UI.form.type, target:1, points:2, unit:"" };
      UI.msg = ""; save();
      break;
    }
    case "delh": {
      if(UI.confirm===i){
        S.cfg.habits = S.cfg.habits.filter(function(x){ return x.id!==i; });
        UI.confirm = null; save();
      } else UI.confirm = i;
      break;
    }
    case "exp": exportData(); break;
    case "imp": document.getElementById("pick").click(); return;
    case "reset": {
      if(UI.confirm==="reset"){
        S.days = {}; UI.confirm=null; UI.msg="مُسح كل السجل."; save();
      } else { UI.confirm="reset"; UI.msg="اضغط مرة أخرى للتأكيد — لا رجعة."; }
      break;
    }
    default: return;
  }
  render();
});

function hStep(id){
  var hb = S.cfg.habits.filter(function(x){ return x.id===id; })[0];
  return hb && hb.target>=50 ? 10 : 1;
}

/* المدخلات النصية — تُحفظ بلا إعادة رسم حتى لا يضيع مؤشر الكتابة */
document.addEventListener("input", function(ev){
  var el = ev.target.closest("[data-inp]"); if(!el) return;
  var f = el.dataset.inp, val = el.value;
  switch(f){
    case "note": editDay(UI.cursor, function(d){ d.note = val; }); break;
    case "pnote": if(UI.sheet) UI.sheet.draft.n = val; break;
    case "hname": UI.form.name = val; break;
    case "htarget": UI.form.target = val; break;
    case "hpoints": UI.form.points = val; break;
    case "hunit": UI.form.unit = val; break;
    case "qtarget": S.cfg.quran.target = Math.max(1, +val||1); save(); break;
    case "qunit": S.cfg.quran.unit = val; save(); break;
  }
});
document.addEventListener("change", function(ev){
  var el = ev.target.closest("[data-inp]"); if(!el) return;
  if(el.dataset.inp==="start"){
    S.cfg.start = el.value || weekStart(today());
    save(); render();
  }
});
document.addEventListener("keydown", function(ev){
  if(ev.key==="Escape" && UI.sheet){ UI.sheet=null; render(); }
});

/* ============================================================
   [١٢] التصدير والاستيراد
   ============================================================ */
function exportData(){
  var blob = new Blob([JSON.stringify({ app:"mirqat", v:1, at:new Date().toISOString(), cfg:S.cfg, days:S.days }, null, 2)],
    { type:"application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = "mirqat-"+today()+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  UI.msg = "تم تنزيل نسخة.";
}
document.getElementById("pick").addEventListener("change", function(ev){
  var file = ev.target.files && ev.target.files[0];
  ev.target.value = "";
  if(!file) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var d = JSON.parse(r.result);
      if(!d || typeof d.days !== "object") throw new Error("bad");
      S.days = d.days || {};
      if(d.cfg) S.cfg = Object.assign({ start:weekStart(today()), theme:"light", quran:{target:5,unit:"صفحة"}, habits:DEFAULT_HABITS.slice() }, d.cfg);
      if(!Array.isArray(S.cfg.habits)) S.cfg.habits = DEFAULT_HABITS.slice();
      document.documentElement.setAttribute("data-theme", S.cfg.theme==="dark"?"dark":"light");
      UI.msg = "تم الاستيراد بنجاح.";
      save(); render();
    }catch(e){
      UI.msg = "الملف غير صالح.";
      render();
    }
  };
  r.readAsText(file);
});

/* ============================================================
   [١٣] الإقلاع
   ============================================================ */
load();
UI.cursor = today();
UI.month = today().slice(0,7);
render();
</script>
